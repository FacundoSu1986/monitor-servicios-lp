name: Ejecutar Bot La Plata
on:
  schedule:
    - cron: '0 9,21 * * *' # Corre todos los días a las 9 AM y 9 PM (hora UTC)
  workflow_dispatch: # Permite que vos le des a "Play" manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar librerías
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Correr el bot
        run: python bot_lp.py

      - name: Guardar cambios
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add historial_lp.csv
          git commit -m "Actualización automática de historial" || exit 0
          git push
