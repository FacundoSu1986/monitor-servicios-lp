name: Ejecutar Bot La Plata

on:
  schedule:
    # Original: 09:00 y 21:00 UTC = 06:00 y 18:00 America/Buenos_Aires.
    # Si preferís 09:00 y 21:00 hora Argentina, usá: '0 12,0 * * *'
    # GitHub puede atrasar el cron varias horas.
    - cron: '0 9,21 * * *'
    # Keepalive: se chequea todos los lunes. Solo commitea si no hubo
    # actividad en ~50 días, para que GitHub no apague el cron a los 60.
    # Un chequeo solo mensual puede llegar tarde (después del corte).
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-lp
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || github.event.schedule == '0 9,21 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Correr el bot
        env:
          TZ: America/Buenos_Aires
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_lp.py

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historial_lp.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial."
            exit 0
          fi
          git commit -m "Actualización automática de historial"
          git push

      - name: Avisar error por Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +x
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram no configurado; se omite el aviso."
            exit 0
          fi
          texto="Monitor LP: falló el workflow. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          codigo=$(curl -sS -o /tmp/tg-fail.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${texto}\"}")
          if [ "$codigo" != "200" ]; then
            echo "No se pudo avisar por Telegram (HTTP ${codigo})."
            exit 0
          fi

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keepalive si no hubo commits en 50 días
        run: |
          ultimo=$(git log -1 --format=%ct)
          ahora=$(date +%s)
          dias=$(( (ahora - ultimo) / 86400 ))
          echo "Último commit hace ${dias} día(s)."
          if [ "$dias" -lt 50 ]; then
            echo "Hay actividad reciente; no hace falta keepalive."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "Keepalive: evita que GitHub desactive el cron"
          git push
