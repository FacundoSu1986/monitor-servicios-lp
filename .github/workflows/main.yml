name: Ejecutar Bot La Plata

on:
  schedule:
    # 09:17 y 21:17 UTC = 06:17 y 18:17 hora Argentina.
    # El minuto 17 es a propósito: GitHub atrasa (y a veces descarta) más los
    # crons en punto. Si cambiás este valor, actualizá también los `if:` de abajo.
    # Aunque el cron se atrase horas, el sitemap cubre ~48 h y no se pierden notas.
    - cron: '17 9,21 * * *'
    # Keepalive: se chequea todos los lunes. Solo commitea si no hubo
    # actividad en ~50 días, para que GitHub no apague el cron a los 60.
    - cron: '23 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-lp
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || github.event.schedule == '17 9,21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Correr el bot
        env:
          TZ: America/Argentina/Buenos_Aires
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_lp.py

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historial_lp.csv notas_enriquecidas.geojson
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial ni en el GeoJSON."
            exit 0
          fi
          git commit -m "Actualización automática de historial"
          # Si alguien pusheó mientras corría el bot, integra y reintenta.
          for intento in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento ${intento}); integro cambios remotos."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Avisar error por Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +x
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram no configurado; se omite el aviso."
            exit 0
          fi
          texto="Monitor LP: falló el workflow. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          codigo=$(curl -sS -o /tmp/tg-fail.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${texto}\"}")
          if [ "$codigo" != "200" ]; then
            echo "No se pudo avisar por Telegram (HTTP ${codigo})."
            exit 0
          fi

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '23 12 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Keepalive si no hubo commits en 50 días
        run: |
          ultimo=$(git log -1 --format=%ct)
          ahora=$(date +%s)
          dias=$(( (ahora - ultimo) / 86400 ))
          echo "Último commit hace ${dias} día(s)."
          if [ "$dias" -lt 50 ]; then
            echo "Hay actividad reciente; no hace falta keepalive."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "Keepalive: evita que GitHub desactive el cron"
          git push
