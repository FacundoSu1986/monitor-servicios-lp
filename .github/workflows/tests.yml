name: Tests

on:
  pull_request:
  push:
    # Los commits automáticos del bot solo tocan el CSV: no disparan esto.
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Correr tests
        run: python -m unittest discover -s tests -v
